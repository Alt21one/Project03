<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 04 - Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Task Manager</h1>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Enter a task" aria-label="New task">
      <button id="addTask" type="button">Add task</button>
    </div>
    <p id="taskCounter" aria-live="polite">Total tasks: 0</p>
    <ul id="taskList"></ul>
  </main>
</body>
</html>
